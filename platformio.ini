; https://docs.platformio.org/en/latest/platforms/espressif32.html

[platformio]
boards_dir = ./boards
default_envs = development
; uncomment to build an example
; src_dir = ./examples/blink

[env]
framework = arduino
check_tool = clangtidy
check_skip_packages = yes
check_src_filters =
    +<src/**>
check_flags =
    clangtidy: --checks=-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-deadcode.*,clang-analyzer-security.*,bugprone-dangling-handle,bugprone-misplaced-widening-cast,bugprone-signed-char-misuse,bugprone-sizeof-expression,bugprone-string-constructor,bugprone-suspicious-memset-usage,bugprone-use-after-move
board_build.embed_txtfiles =
    config/default_configuration.json
board_build.filesystem = littlefs
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.3
; Use high performance libraries to improve the performance, and avoid esp32s3 RGB LCD screen drifting issue
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
build_unflags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DSWITCH_ACTUATOR_BOARD=0
    -DPSY_ENABLE_SSL
    -DPSYCHIC_WS_MAX_PENDING_FRAMES=2
    -DMAX_REQUEST_BODY_SIZE=2048
    ; to use e.g. as part of the firmware name 
    '-DPIOENV="${PIOENV}"'

    ; coding_standards
    -Wunreachable-code
build_src_flags =
    -Wall
    -Wextra
    -fstack-usage

    ; NOTE: -Werror and -Wstack-usage=8192 are enforced by clang-tidy and
    ; cppcheck static analysis gates (tools/analysis/) which target only
    ; owned source. Keeping them in build_src_flags breaks third-party
    ; libraries (nanomodbus) compiled through the same source tree.
extra_scripts = pre:extra_script.py
lib_deps =
    ; place global libs here or under extra.lib_deps_external (see below)
    https://github.com/bblanchon/ArduinoJson.git
    https://github.com/funbiscuit/embedded-cli.git#v0.1.4
    https://github.com/betamoojw/ESP32_KNX_IP_Library_fix2bytefloat.git
    es4a/Relay@^1.0.0
    fastled/FastLED@^3.10.1
    https://github.com/NorthernWidget/DS3231.git#v1.1.2
    lennarthennigs/Button2@^2.4.1
    https://github.com/betamoojw/arduino-logger.git#v1.0.1
    networking-for-arduino/EthernetESP32@^1.0.2
    WiFi
    https://github.com/tostmann/improv-wifi-busware.git
    hoeken/PsychicHttp@3.1.2
lib_ignore =
    ; Logger uses Arduino-ESP32's built-in LittleFS wrapper. Its generic
    ; littlefs dependency duplicates symbols already supplied by the framework.
    littlefs

monitor_speed = 115200
upload_speed = 921600
; uncomment and configure when you have multiple ESPs connected
; upload_port = /dev/tty.usbserial-...
; monitor_port = /dev/tty.usbserial-...

; CUSTOM options
; You need manually inject these options into a section
; using ${extra.<name_of_option>} (see below)
[extra]
; https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/external-ram.html
build_flags_psram =
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue ; https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/external-ram.html#esp32-rev-v1
lib_deps_builtin =
  SPI
  Wire
lib_deps_external =
    ; extend libs for all platforms here

[esp32s3]
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    ${extra.lib_deps_builtin}
    ${extra.lib_deps_external}
    ; extend libs only for esp32s3 based modules here

; ************************************
; * ESP32-S3 *
; ************************************

; pio board config: https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html
; https://www.waveshare.com/wiki/ESP32-S3-Relay-6CH
[waveshare_esp32s3_relay_6ch]
extends = esp32s3
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3.build_flags}
    ; PSRAM is optional
lib_deps =
    ${esp32s3.lib_deps}

[env:development]
extends = waveshare_esp32s3_relay_6ch
build_flags =
    ${esp32s3.build_flags}
    -DSWITCH_ACTUATOR_DEPLOYMENT_PROFILE=0
    -DSWITCH_ACTUATOR_ENABLE_DEBUG_INTERFACES=1
    -DSWITCH_ACTUATOR_ALLOW_DEVELOPMENT_CREDENTIALS=1
    -DCORE_DEBUG_LEVEL=5
    -Og
    -g3

[env:engineering]
extends = waveshare_esp32s3_relay_6ch
build_flags =
    ${esp32s3.build_flags}
    -DSWITCH_ACTUATOR_DEPLOYMENT_PROFILE=1
    -DSWITCH_ACTUATOR_ENABLE_DEBUG_INTERFACES=1
    -DSWITCH_ACTUATOR_ALLOW_DEVELOPMENT_CREDENTIALS=0
    -DCORE_DEBUG_LEVEL=4
    -Og
    -g3

[env:production]
extends = waveshare_esp32s3_relay_6ch
board_build.partitions = partitions/production_8MB.csv
build_unflags =
    ${env.build_unflags}
    -O0
    -Og
    -O1
    -O2
    -Os
    -O3
build_flags =
    ${esp32s3.build_flags}
    -DSWITCH_ACTUATOR_DEPLOYMENT_PROFILE=2
    -DSWITCH_ACTUATOR_ENABLE_DEBUG_INTERFACES=0
    -DSWITCH_ACTUATOR_ALLOW_DEVELOPMENT_CREDENTIALS=0
    -DSWITCH_ACTUATOR_REQUIRE_SECURE_BOOT=1
    -DSWITCH_ACTUATOR_REQUIRE_FLASH_ENCRYPTION=1
    -DSWITCH_ACTUATOR_REQUIRE_SIGNED_FIRMWARE=1
    -DCORE_DEBUG_LEVEL=1
    -DNDEBUG
    -O2

[env:native]
platform = native
framework =
platform_packages =
extra_scripts =
test_framework = unity
test_filter = test_unit
lib_deps =
	throwtheswitch/Unity@^2.6.1
build_flags =
    -std=c++17
build_src_filter =
    +<domain/configuration.cpp>
    +<domain/device_identity.cpp>
    +<app/configuration_service.cpp>
    +<app/command_arbiter.cpp>
    +<app/relay_command_queue.cpp>
    +<app/relay_command_service.cpp>
    +<app/switching_policy_service.cpp>
    +<app/scene_service.cpp>
    +<app/service_mode_service.cpp>
    +<app/relay_timer_service.cpp>
    +<app/wifi_management_service.cpp>
    +<app/web_event_journal.cpp>
    +<app/web_security_service.cpp>
    +<app/web_command_tracker.cpp>
    +<app/web_request_queue.cpp>
    +<app/diagnostics_service.cpp>
    +<adapters/modbus/modbus_register_map.cpp>