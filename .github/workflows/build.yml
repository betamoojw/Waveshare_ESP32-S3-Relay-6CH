on:
  push:
    tags-ignore:
      - "**"
  pull_request:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
      - name: Install PlatformIO
        run: python3 -m pip install pioarduino==6.1.19
      - name: Build development firmware
        run: FIRMWARE_VERSION=main platformio run -e development
      - name: Build engineering firmware
        run: FIRMWARE_VERSION=main platformio run -e engineering
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/development/firmware_*.bin
            .pio/build/engineering/firmware_*.bin
          retention-days: 1
